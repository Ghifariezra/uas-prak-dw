<!DOCTYPE html>
<html lang="id" class="scroll-smooth antialiased">

<head>
    <title>BeritaKita</title>
    <link rel="ico" type="image/x-icon" href="./assets/icons/newspaper.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS (Hanya satu versi!) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <header class="flex justify-between items-center p-4 bg-white shadow-md relative z-20">

        <!-- Hamburger Mobile -->
        <button id="hamburger-btn" class="block sm:hidden cursor-pointer">
            <!-- Icon open -->
            <svg id="icon-open"
                class="w-7 h-7 text-gray-800"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                    d="M5 7h14M5 12h14M5 17h14" />
            </svg>

            <!-- Icon close -->
            <svg id="icon-close"
                class="w-7 h-7 text-gray-800 hidden"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 18 17.94 6M18 18 6.06 6" />
            </svg>
        </button>

        <!-- Logo -->
        <a href="index.html">
            <h1 class="text-2xl font-bold">BeritaKita</h1>
        </a>

        <!-- Search Mobile -->
        <div class="block sm:hidden">
            <a href="index.html">
                <svg class="w-6 h-6 text-gray-800" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                        d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                </svg>
            </a>
        </div>

        <!-- Navigation Desktop -->
        <nav class="hidden sm:block">
            <ul class="flex items-center space-x-6 font-medium">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="index.html">Kategori</a></li>
                <li><a href="index.html">Tentang Kami</a></li>
                <li><a href="index.html">Kontak</a></li>
                <li>
                    <a href="index.html">
                        <svg class="w-6 h-6 text-gray-800" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                                d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Navigation Mobile -->
    <nav id="mobile-nav"
     class="sm:hidden bg-white w-full shadow-md hidden transform scale-y-0 transition-all duration-300 origin-top">
        <ul class="flex flex-col items-center py-4 space-y-4 text-lg font-medium">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="index.html">Kategori</a></li>
            <li><a href="index.html">Tentang Kami</a></li>
            <li><a href="index.html">Kontak</a></li>
        </ul>
    </nav>

    <script defer type="module" src="scripts/home.js"></script>
</body>
</html>
